name: CI

on:
  pull_request:
  push:
    branches: [master, main]
    tags: '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} / ${{ matrix.os }} / ${{ matrix.threads }} threads
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Codecov authenticates with OIDC instead of a stored token.
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
        threads: ['1', '2,1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Run tests
        shell: julia --color=yes {0}
        env:
          CI_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.threads == '2,1' }}
        run: |
          using Pkg
          # Resolve each Julia version independently of the committed manifest.
          # Use this checkout and resolve SequentialMonteCarlo from the registry.
          Pkg.activate(; temp=true)
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.test("SMCExamples";
            coverage=ENV["CI_COVERAGE"] == "true",
            julia_args=["--check-bounds=yes"])
          # Once per matrix, also check the algorithm's tests that use these models.
          if ENV["CI_COVERAGE"] == "true"
            Pkg.test("SequentialMonteCarlo"; julia_args=["--check-bounds=yes"])
          end
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.threads == '2,1'
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.threads == '2,1'
        with:
          files: lcov.info
          use_oidc: true
